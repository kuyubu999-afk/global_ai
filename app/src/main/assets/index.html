<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>全球全模态 AI 导游</title>
    <style>
        :root { --primary: #2563eb; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; }
        header { padding: 16px; background: var(--card); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        header h1 { font-size: 18px; font-weight: 600; }
        .btn-icon { background: #334155; border: none; color: white; padding: 8px 12px; border-radius: 8px; font-size: 14px; }
        #chat-box { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
        .msg { max-width: 88%; padding: 12px 16px; border-radius: 16px; line-height: 1.5; font-size: 15px; word-wrap: break-word; }
        .msg.ai { background: var(--card); align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #334155; }
        .msg.user { background: var(--primary); align-self: flex-end; border-bottom-right-radius: 4px; }
        .msg img { max-width: 100%; border-radius: 8px; margin-top: 8px; display: block; }
        .speak-btn { margin-top: 8px; background: #334155; color: #93c5fd; border: none; padding: 4px 10px; border-radius: 12px; font-size: 12px; }
        .quick-tags { display: flex; gap: 8px; padding: 8px 16px; overflow-x: auto; background: #0f172a; }
        .tag { background: #1e293b; border: 1px solid #334155; color: #cbd5e1; padding: 6px 12px; border-radius: 16px; font-size: 13px; white-space: nowrap; }
        .input-area { padding: 12px; background: var(--card); display: flex; gap: 8px; align-items: center; border-top: 1px solid #334155; }
        input[type="text"] { flex: 1; min-width: 0; background: #0f172a; border: 1px solid #334155; color: white; padding: 10px 14px; border-radius: 20px; font-size: 15px; outline: none; }
        .action-btn { width: 40px; height: 40px; flex: 0 0 40px; border-radius: 50%; border: none; background: #334155; color: white; font-size: 18px; display: flex; align-items: center; justify-content: center; }
        .send-btn { background: var(--primary); }
        #settings-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; padding: 20px; z-index: 99; }
        .modal-content { background: var(--card); padding: 20px; border-radius: 16px; width: 100%; max-width: 400px; }
        .modal-content input { width: 100%; margin: 10px 0 16px; padding: 10px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; }
        #preview-bar { display: none; padding: 8px 16px; background: #1e293b; align-items: center; justify-content: space-between; font-size: 13px; color: #93c5fd; }
    </style>
</head>
<body>
<header>
    <h1>🌍 全球全模态 AI 导游</h1>
    <button class="btn-icon" onclick="openSettings()">⚙️ API设置</button>
</header>
<div id="chat-box">
    <div class="msg ai">
        你好！我是你的全球全模态随身导游。<br><br>
        你可以：<br>
        1️⃣ <b>输入城市/地域名</b>（如“阿拉木图”、“京都”、“冰岛高地”）获取深度攻略；<br>
        2️⃣ 点击 <b>📷 拍照/传图</b>，让我识别眼前的建筑、菜单或路牌；<br>
        3️⃣ 点击 <b>🎤 语音</b> 直接和我对话。
    </div>
</div>
<div class="quick-tags">
    <div class="tag" onclick="quickAsk('推荐阿拉木图及周边3日深度自然与人文路线')">🇰🇿 阿拉木图攻略</div>
    <div class="tag" onclick="quickAsk('巴黎卢浮宫有哪些必看镇馆之宝与避坑建议？')">🇫🇷 巴黎卢浮宫</div>
    <div class="tag" onclick="quickAsk('日本京都小众寺庙与地道美食推荐')">🇯🇵 京都深度游</div>
    <div class="tag" onclick="quickAsk('去南美秘鲁马丘比丘需要做哪些高反与装备准备？')">🇵🇪 秘鲁马丘比丘</div>
</div>
<div id="preview-bar">
    <span id="file-name">已选择图片</span>
    <span onclick="clearImage()" style="color:#f87171;">✖ 取消</span>
</div>
<div class="input-area">
    <input type="file" id="image-input" accept="image/*" capture="environment" style="display:none" onchange="handleImage(event)">
    <button class="action-btn" onclick="document.getElementById('image-input').click()">📷</button>
    <button class="action-btn" id="mic-btn" onclick="startVoice()">🎤</button>
    <input type="text" id="user-input" placeholder="输入城市、地域或你想问的..." onkeypress="if(event.key==='Enter') sendMessage()">
    <button class="action-btn send-btn" onclick="sendMessage()">➤</button>
</div>
<div id="settings-modal">
    <div class="modal-content">
        <h3>配置大模型 API Key</h3>
        <p style="font-size:12px; color:#94a3b8; margin-top:4px;">支持 Gemini API Key</p>
        <label style="font-size:13px; display:block; margin-top:12px;">Gemini API Key:</label>
        <input type="password" id="api-key-input" placeholder="输入 Gemini API Key">
        <button onclick="saveSettings()" style="width:100%; padding:10px; background:var(--primary); color:white; border:none; border-radius:8px; font-weight:bold;">保存设置</button>
        <button onclick="closeSettings()" style="width:100%; padding:10px; margin-top:8px; background:#334155; color:white; border:none; border-radius:8px;">关闭</button>
    </div>
</div>
<script>
    let selectedImageBase64 = null;
    let selectedMimeType = "image/jpeg";

    function openSettings() {
        document.getElementById('api-key-input').value = localStorage.getItem('gemini_api_key') || '';
        document.getElementById('settings-modal').style.display = 'flex';
    }
    function closeSettings() {
        document.getElementById('settings-modal').style.display = 'none';
    }
    function saveSettings() {
        const key = document.getElementById('api-key-input').value.trim();
        if (!key) { alert('请先输入 API Key'); return; }
        localStorage.setItem('gemini_api_key', key);
        closeSettings();
        alert('配置已保存！');
    }
    function handleImage(e) {
        const file = e.target.files[0];
        if (!file) return;
        selectedMimeType = file.type || "image/jpeg";
        const reader = new FileReader();
        reader.onload = function(event) {
            selectedImageBase64 = event.target.result.split(',')[1];
            document.getElementById('preview-bar').style.display = 'flex';
            document.getElementById('file-name').innerText = '📷 已附带照片: ' + file.name;
        };
        reader.readAsDataURL(file);
    }
    function clearImage() {
        selectedImageBase64 = null;
        document.getElementById('preview-bar').style.display = 'none';
        document.getElementById('image-input').value = '';
    }
    function startVoice() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert('当前系统内核不支持直接语音识别，请直接输入文字。');
            return;
        }
        const recognition = new SpeechRecognition();
        recognition.lang = 'zh-CN';
        const micBtn = document.getElementById('mic-btn');
        micBtn.style.background = '#ef4444';
        recognition.onresult = (event) => {
            document.getElementById('user-input').value = event.results[0][0].transcript;
            micBtn.style.background = '#334155';
            sendMessage();
        };
        recognition.onerror = () => { micBtn.style.background = '#334155'; };
        recognition.onend = () => { micBtn.style.background = '#334155'; };
        recognition.start();
    }
    function speakText(text) {
        if (!('speechSynthesis' in window)) { alert('当前设备不支持语音朗读'); return; }
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text.replace(/[#*\x60]/g, ''));
        utterance.lang = 'zh-CN';
        window.speechSynthesis.speak(utterance);
    }
    function quickAsk(text) {
        document.getElementById('user-input').value = text;
        sendMessage();
    }
    function appendMessage(role, text, imgSrc = null) {
        const box = document.getElementById('chat-box');
        const div = document.createElement('div');
        div.className = 'msg ' + role;
        div.textContent = text;
        if (imgSrc) {
            const img = document.createElement('img');
            img.src = imgSrc;
            img.alt = '用户上传的图片';
            div.appendChild(img);
        }
        if (role === 'ai') {
            const btn = document.createElement('button');
            btn.className = 'speak-btn';
            btn.textContent = '🔊 语音朗读导游词';
            btn.onclick = () => speakText(text);
            div.appendChild(document.createElement('br'));
            div.appendChild(btn);
        }
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
        return div;
    }
    async function sendMessage() {
        const input = document.getElementById('user-input');
        const text = input.value.trim();
        if (!text && !selectedImageBase64) return;

        const apiKey = localStorage.getItem('gemini_api_key');
        const imgPreview = selectedImageBase64 ? 'data:' + selectedMimeType + ';base64,' + selectedImageBase64 : null;
        appendMessage('user', text || '请识别这张图片并提供旅游讲解', imgPreview);
        input.value = '';

        const currentImg = selectedImageBase64;
        const currentMime = selectedMimeType;
        clearImage();

        if (!apiKey) {
            appendMessage('ai', '⚠️ 请先点击右上角【⚙️ API设置】填入你的 Gemini API Key，即可激活全球全模态旅游导游功能！');
            return;
        }

        const loadingDiv = appendMessage('ai', '正在为你检索全球地理与文化库...');
        try {
            const parts = [{
                text: '你是一个精通全球地理、历史、文化、美食与旅行规划的导游。请用中文生动、实用、结构清晰地回答。如果是城市或地域名，请涵盖核心亮点、必去地标、当地美食和旅行贴士。用户问题：' +
                    (text || '请详细讲解图中的景点、文字或物品。')
            }];
            if (currentImg) {
                parts.push({ inline_data: { mime_type: currentMime, data: currentImg } });
            }

            const response = await fetch(
                'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=' + encodeURIComponent(apiKey),
                {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts }] })
                }
            );
            const data = await response.json();
            loadingDiv.remove();

            if (!response.ok) {
                const message = data && data.error && data.error.message
                    ? data.error.message : 'HTTP ' + response.status;
                appendMessage('ai', '请求失败：' + message);
                return;
            }
            const reply = data && data.candidates && data.candidates[0] &&
                data.candidates[0].content && data.candidates[0].content.parts
                ? data.candidates[0].content.parts.map(part => part.text || '').join('\n').trim()
                : '';
            appendMessage('ai', reply || '模型没有返回可显示的文本，请稍后重试。');
        } catch (err) {
            loadingDiv.remove();
            appendMessage('ai', '网络请求失败，请检查网络连接后重试。');
        }
    }
</script>
</body>
</html>
